version: 2

sources:
  - name: raw_staging
    database: SEC_FINANCIAL
    schema: RAW_STAGING
    tables:
      - name: raw_sub
        description: "Raw SEC submission data — one row per filing"
        columns:
          - name: adsh
            description: "Accession number — unique filing identifier"
            tests:
              - not_null
              - unique
          - name: cik
            description: "Central Index Key — unique company identifier"
            tests:
              - not_null
          - name: form
            description: "Form type e.g. 10-K, 10-Q"
            tests:
              - not_null

      - name: raw_num
        description: "Raw SEC numeric data — one row per financial fact"
        columns:
          - name: adsh
            description: "Accession number linking back to raw_sub"
            tests:
              - not_null
          - name: tag
            description: "XBRL tag name e.g. Assets, NetIncomeLoss"
            tests:
              - not_null
          - name: value
            description: "Numeric value of the financial fact"
            tests:
              - not_null:
                  config:
                    severity: warn

      - name: raw_tag
        description: "XBRL tag definitions"
        columns:
          - name: tag
            description: "Tag name"
            tests:
              - not_null
          - name: version
            description: "Tag version"
            tests:
              - not_null

      - name: raw_pre
        description: "Financial statement presentation order"
        columns:
          - name: adsh
            description: "Accession number"
            tests:
              - not_null